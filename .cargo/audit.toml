# cargo-audit configuration.
#
# cargo-audit reads its config from .cargo/audit.toml (relative to the working
# directory) or ~/.cargo/audit.toml. It does NOT read a repo-root audit.toml,
# and there is no CLI flag to point at a config file (`-f` is the lockfile path).
# This file lives at .cargo/audit.toml for that reason.
#
# The audit job stays hard-fail: only the advisories explicitly listed below are
# suppressed, so any NEW advisory still breaks CI. Each entry below has no
# available upstream fix; everything fixable is fixed in Cargo.lock instead.

[advisories]
ignore = [
    # rsa 0.9.10 (Marvin timing sidechannel). Present in Cargo.lock because sqlx
    # resolves sqlx-mysql unconditionally, and sqlx-mysql depends on rsa. cargo
    # audit scans the lockfile, so it flags rsa even though it is NOT linked into
    # our binary: sqlx is built postgres-only (crates/gitlawb-node/Cargo.toml),
    # so the MySQL RSA auth path is never compiled and there is no RSA oracle to
    # attack. No upstream fix exists regardless. REMOVE this ignore if sqlx is
    # ever built with the `mysql` feature, or any other consumer of rsa enters
    # the build, at which point it becomes a real reachable advisory.
    "RUSTSEC-2023-0071", # rsa Marvin attack (no fix; not linked in our build)

    # lru 0.12.5 (use-after-free in pop()). Reachable via aws-sdk-s3
    # (reverted from the upgrade that pulled in lru 0.12.5). The
    # lockfile currently has 0.12.5 (via aws-sdk-s3) AND 0.16.3 (via
    # alloy). The RUSTSEC-2026-0253 advisory covers both ranges, and
    # this ignore is still load-bearing for 0.12.5 — a future alloy
    # release that bumps 0.16.x to a fixed version would let this
    # ignore retire for the 0.16 range. REMOVE only when BOTH
    # lockfile versions are fixed (or removed).
    # Retirement owner: node maintainers, enforced by the weekly
    # audit-schedule drift guard ("Fail if lru moved while its ignore
    # remains"), which fails if either locked version moves or lru
    # leaves the tree. No separate tracking issue exists; file one
    # against the lru upgrade if this waiver needs discussion outside
    # the schedule job.
    "RUSTSEC-2026-0253",
    #
    # Round-3 P2 (reviewer 2): the previous version of this file
    # ignored RUSTSEC-2026-0258 for h2 0.4.13, but the lockfile
    # already has h2 0.4.18 (verified 2026-08-31: cargo tree -p h2
    # shows 0.4.18) — the fix is in. The ignore was stale and would
    # have silently re-accepted the advisory if h2 dropped back to
    # 0.4.13. Removed.
    # crypto-bigint 0.5.5 (secret-dependent branches in operations meant
    # to be constant-time). REACHABLE accepted risk, on two paths:
    # - alloy-signer -> elliptic-curve 0.13 -> crypto-bigint 0.5: the k256
    #   PrivateKeySigner that signs transactions in `gl name`
    #   (crates/gl/src/name.rs) and the node operator
    #   (crates/gitlawb-node/src/operator.rs).
    # - aws-sigv4 (`sigv4a` feature, crates/gitlawb-node/Cargo.toml) ->
    #   crypto-bigint 0.5 (directly and via p256 0.13): SigV4a key
    #   derivation, used only for requests to endpoints that require SigV4a
    #   (e.g. S3 Multi-Region Access Points).
    # Exploiting it needs local timing observation of those signing operations.
    # The fix is crypto-bigint >=0.7.6, and no compatible dependent uses it:
    # every alloy-signer release (through 2.5.0) requires elliptic-curve ^0.13,
    # and aws-sigv4 1.6.4 is the first release on crypto-bigint 0.7 (1.5.x -
    # 1.6.3 still require ^0.5.4), but it needs Rust 1.94.1, above our 1.91 MSRV
    # (verified 2026-11-03). REMOVE only when Cargo.lock has no crypto-bigint
    # below 0.7.6: `grep -A1 'name = "crypto-bigint"' Cargo.lock`.
    "RUSTSEC-2026-0387", # crypto-bigint timing variability (no compatible fix)
]
